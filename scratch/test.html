<!DOCTYPE html>
<html>
<body>
<div id="test"></div>
<script>
const html = `
<main class="site-main">
    <div class="container py-4">
        <a class="sidebar-link" href="#intro">What is Swimming?</a>
        <a class="sidebar-link" href="#types">Types</a>
        <section id="intro">Intro</section>
        <section id="types">Types Content</section>
    </div>
</main>
`;
const parser = new DOMParser();
const doc = parser.parseFromString(html, 'text/html');
const mainContent = doc.querySelector('.site-main');
const modalBody = document.getElementById('test');
modalBody.innerHTML = mainContent.innerHTML;

const allNavLinks = modalBody.querySelectorAll('.sidebar-link, .topic-chip');
console.log("Nav Links count:", allNavLinks.length);
</script>
</body>
</html>
